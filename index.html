<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CarrierDesk</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--road:#22262b;--paper:#eef0ec;--sign:#0a6b45;--amber:#f4b41a;--line:#c9cdc6;--card:#fbfbf8}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--road);font:16px/1.5 "Source Sans 3",system-ui,sans-serif}
header{background:var(--road);color:#fff;padding:22px 20px;border-bottom:6px solid var(--amber)}
h1{font:800 28px/1.1 Archivo,sans-serif;margin:0}
header p{margin:6px 0 0;color:#c9cdc6}
main{max-width:1000px;margin:0 auto;padding:20px}
h2{font:700 20px Archivo,sans-serif;margin:28px 0 10px}
.bar{display:flex;gap:8px;flex-wrap:wrap}
select,input,button{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--road)}
input.q{flex:1;min-width:200px}
button{cursor:pointer;background:var(--sign);color:#fff;border-color:var(--sign);font-weight:600}
button.alt{background:#fff;color:var(--road);border-color:var(--line)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--amber);outline-offset:1px}
.row{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:12px 14px;margin-top:8px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.row b{font:700 17px Archivo,sans-serif}
.meta{color:#555b61;font-size:14px}
.ok{color:var(--sign);font-weight:600}.no{color:#b3261e;font-weight:600}
.msg{margin-top:12px;color:#555b61}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line)}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);font-size:14px;vertical-align:middle}
th{background:#e3e6df;font-family:Archivo,sans-serif}
td input,td select{padding:6px 8px;width:100%}
@media (prefers-reduced-motion:no-preference){button{transition:filter .15s}button:hover{filter:brightness(1.1)}}
</style></head><body>
<header><h1>CarrierDesk</h1><p>Search FMCSA carriers, save leads, track who you have contacted.</p></header>
<main>
<div class="bar">
  <select id="type" aria-label="Search by"><option value="mc">MC number</option><option value="dot">DOT number</option><option value="name">Company name</option></select>
  <input id="q" class="q" placeholder="Enter MC, DOT or company name" aria-label="Search">
  <button id="go">Search carriers</button>
</div>
<div id="msg" class="msg"></div>
<div id="results"></div>

<h2>My leads</h2>
<div class="bar"><button class="alt" id="csv">Download CSV</button><button class="alt" id="clear">Clear all leads</button></div>
<div id="empty" class="msg">No leads yet. Search a carrier and choose Save lead.</div>
<div class="tablewrap"><table id="tbl" hidden><thead><tr><th>Carrier</th><th>DOT</th><th>MC</th><th>Location</th><th>Authority</th><th>Stage</th><th>Notes</th><th></th></tr></thead><tbody id="leads"></tbody></table></div>
</main>
<script>
const $=id=>document.getElementById(id);
const STAGES=["New","Contacted","Interested","Onboarded","Not interested"];
let leads=[];
try{leads=JSON.parse(localStorage.getItem("leads")||"[]")}catch(e){}
const save=()=>{try{localStorage.setItem("leads",JSON.stringify(leads))}catch(e){}};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let found=[];

async function search(){
  const q=$("q").value.trim(); if(!q){$("msg").textContent="Enter a number or name first.";return}
  $("msg").textContent="Searching…";$("results").innerHTML="";
  try{
    const r=await fetch(`/api/carrier?type=${$("type").value}&q=${encodeURIComponent(q)}`);
    const d=await r.json();
    if(!r.ok){$("msg").textContent=d.error||"Search failed.";return}
    found=d.results;
    $("msg").textContent=found.length?`${found.length} carrier(s) found.`:"No carriers found. Check the number or try a different spelling.";
    $("results").innerHTML=found.map((c,i)=>`<div class="row"><div><b>${esc(c.name)}</b>${c.dba?` <span class="meta">dba ${esc(c.dba)}</span>`:""}
      <div class="meta">DOT ${esc(c.dot)}${c.mc?` · MC ${esc(c.mc)}`:""} · ${esc(c.city)}, ${esc(c.state)} · ${esc(c.units)} trucks · ${esc(c.drivers)} drivers · Safety: ${esc(c.rating)}</div>
      <div class="${c.authorized?"ok":"no"}">${c.authorized?"Authorized to operate":"Not authorized to operate"}</div></div>
      <button data-i="${i}">Save lead</button></div>`).join("");
  }catch(e){$("msg").textContent="Could not reach the server. Is the site deployed with /api?"}
}
$("results").onclick=e=>{
  const i=e.target.dataset.i; if(i===undefined)return;
  const c=found[i]; if(leads.some(l=>l.dot==c.dot)){$("msg").textContent="Already in your leads.";return}
  leads.push({...c,stage:"New",notes:""});save();render();$("msg").textContent=`Saved ${c.name}.`;
};
function render(){
  $("tbl").hidden=!leads.length;$("empty").hidden=!!leads.length;
  $("leads").innerHTML=leads.map((l,i)=>`<tr><td><b>${esc(l.name)}</b></td><td>${esc(l.dot)}</td><td>${esc(l.mc)}</td><td>${esc(l.city)}, ${esc(l.state)}</td>
  <td class="${l.authorized?"ok":"no"}">${l.authorized?"Authorized":"Not authorized"}</td>
  <td><select data-s="${i}">${STAGES.map(s=>`<option${s===l.stage?" selected":""}>${s}</option>`).join("")}</select></td>
  <td><input data-n="${i}" value="${esc(l.notes)}" placeholder="Add note"></td><td><button class="alt" data-d="${i}">Remove</button></td></tr>`).join("");
}
$("leads").onchange=e=>{const i=e.target.dataset.s;if(i!==undefined){leads[i].stage=e.target.value;save()}};
$("leads").oninput=e=>{const i=e.target.dataset.n;if(i!==undefined){leads[i].notes=e.target.value;save()}};
$("leads").onclick=e=>{const i=e.target.dataset.d;if(i!==undefined){leads.splice(i,1);save();render()}};
$("clear").onclick=()=>{if(confirm("Remove all saved leads?")){leads=[];save();render()}};
$("csv").onclick=()=>{
  if(!leads.length){$("msg").textContent="No leads to download.";return}
  const h=["name","dot","mc","city","state","authorized","units","drivers","stage","notes"];
  const rows=[h.join(",")].concat(leads.map(l=>h.map(k=>`"${String(l[k]??"").replace(/"/g,'""')}"`).join(",")));
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([rows.join("\n")],{type:"text/csv"}));a.download="carrier-leads.csv";a.click();
};
$("go").onclick=search;$("q").onkeydown=e=>{if(e.key==="Enter")search()};
render();
</script></body></html>
